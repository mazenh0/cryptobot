server:
  port: ${PORT:8080}
spring:
  codec:
    max-in-memory-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:}
datasource:
  url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tradingbot;AUTO_SERVER=TRUE}
  username: ${SPRING_DATASOURCE_USERNAME:sa}
  password: ${SPRING_DATASOURCE_PASSWORD:}
jpa:
  hibernate:
    ddl-auto: update
  open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: trading-bot
trading:
  paper:
    starting-cash: 10000
  strategy:
    enabled: false
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  security:
    supabase:
      enabled: ${SUPABASE_AUTH_ENABLED:false}
      issuer: ${SUPABASE_JWT_ISSUER:}