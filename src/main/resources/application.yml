server:
  port: ${PORT:8080}
spring:
  codec:
    max-in-memory-size: 10MB
datasource:
  url: jdbc:h2:file:./data/tradingbot;AUTO_SERVER=TRUE
  driver-class-name: org.h2.Driver
  username: sa
  password:
jpa:
  hibernate:
    ddl-auto: update
  open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: trading-bot
trading:
  paper:
    starting-cash: 10000
  strategy:
    enabled: false
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}